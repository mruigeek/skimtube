name: youtube_inshorts
description: "A top-notch, production-grade InShorts-style YouTube summary app for iOS & Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_markdown: ^0.6.17
  cached_network_image: ^3.3.0
  provider: ^6.0.5
  shared_preferences: ^2.2.1
  url_launcher: ^6.1.14
  intl: ^0.18.1
  flutter_tts: ^3.8.3
  share_plus: ^7.2.1
  flutter_local_notifications: ^16.1.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_backup_variant2.png


